<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Messier Jumper Sky Map Viewer - Mobile & PC Responsive</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    #canvas-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      touch-action: none;
      background-color: #000000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #000000;
    }
    
    /* Dark Theme Overlay UI */
    .ui-panel {
      position: absolute;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 10px 14px;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      pointer-events: auto;
    }
    #header-panel {
      top: 14px; left: 14px;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    h1 { font-size: 1rem; color: #38bdf8; font-weight: 700; margin-right: 6px; letter-spacing: 0.5px; }
    
    .btn {
      background: #1e293b; color: #94a3b8; border: 1px solid #334155;
      padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer;
      font-weight: 600; transition: all 0.2s; display: flex; align-items: center; gap: 4px;
    }
    .btn:hover { background: #334155; color: #f8fafc; border-color: #38bdf8; }
    .btn.active { background: #0284c7; border-color: #38bdf8; color: #ffffff; }

    #datetime-panel {
      top: 14px; right: 14px; display: flex; flex-direction: column; gap: 8px; width: 280px;
    }
    .panel-title { font-size: 0.75rem; font-weight: 700; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }
    .datetime-row { display: flex; gap: 6px; align-items: center; }
    input[type="datetime-local"] {
      background: #0f172a; border: 1px solid #334155; color: #f8fafc;
      padding: 5px; border-radius: 4px; font-size: 0.75rem; font-family: monospace; width: 100%;
    }
    .btn-group { display: flex; gap: 4px; width: 100%; }
    .btn-group .btn { flex: 1; justify-content: center; padding: 4px 0; }
    
    #controls-panel {
      bottom: 14px; right: 14px; display: flex; flex-direction: column; gap: 8px; width: 250px;
    }
    label { font-size: 0.75rem; color: #94a3b8; display: flex; align-items: center; justify-space-between; }
    input[type="range"] { accent-color: #38bdf8; cursor: pointer; width: 100px; }
    
    #inspector {
      bottom: 14px; left: 14px; width: 290px; display: none; pointer-events: none;
    }
    #inspector h2 { font-size: 0.95rem; color: #f43f5e; margin-bottom: 6px; }
    .info-row { display: flex; justify-content: space-between; font-size: 0.75rem; margin: 3px 0; color: #94a3b8; }
    .info-val { color: #f1f5f9; font-weight: 600; font-family: monospace; }

    .location-tag { font-size: 0.7rem; color: #64748b; text-align: right; }

    /* Red Night Vision Mode */
    body.night-mode { background-color: #000000; }
    body.night-mode canvas { filter: sepia(100%) hue-rotate(310deg) saturate(900%) contrast(150%); }
    body.night-mode .ui-panel { background: rgba(24, 0, 0, 0.92); border-color: #7f1d1d; }
    body.night-mode h1, body.night-mode .panel-title, body.night-mode .info-val { color: #ef4444; }
    body.night-mode .btn { background: #450a0a; border-color: #7f1d1d; color: #fca5a5; }
    body.night-mode .btn.active { background: #991b1b; color: #fff; }
    body.night-mode input { background: #1a0303; border-color: #7f1d1d; color: #fca5a5; }
  </style>
</head>

<div id="canvas-container">

</div>

<!-- Header Navigation Bar -->
<div id="header-panel" class="ui-panel">

  <button class="btn active" id="toggle-ecliptic">Ecliptic</button>
  <button class="btn" id="toggle-grid">Grid: Off</button>
  <button class="btn" id="toggle-night">Night Mode (Red)</button>
</div>

<!-- Date & Time Control Panel -->
<div id="datetime-panel" class="ui-panel">
  <div class="panel-title">Observation Date & Time</div>
  <div class="datetime-row">
    <input type="datetime-local" id="datetime-input">
  </div>
  <div class="btn-group">

    <button class="btn" id="btn-sub-day">-1d</button>
    <button class="btn" id="btn-add-day">+1d</button>
  </div>
  <div class="location-tag">Location: Orlando, FL (28.54°N, 81.38°W)</div>
</div>

<!-- Display Settings Panel -->
<div id="controls-panel" class="ui-panel">
  <label>Mag Limit: <span id="mag-val" style="color:#38bdf8; font-weight:bold;">5.0</span>
    <input type="range" id="mag-limit" min="1.0" max="6.0" step="0.1" value="5.0">
  </label>
  <label>Zoom Level: <span id="zoom-val" style="color:#38bdf8; font-weight:bold;">1.0x</span>
    <div style="display:flex; gap:4px;">
      <button class="btn" id="btn-zoom-out" style="padding:2px 8px;">-</button>
      <button class="btn" id="btn-zoom-in" style="padding:2px 8px;">+</button>
    </div>
  </label>
  <label>Time Speed
    <select id="time-speed" class="btn" style="padding:2px 6px;">
      <option value="1">Realtime (1x)</option>
      <option value="60">1 min/sec (60x)</option>
      <option value="3600">1 hr/sec (3600x)</option>
    </select>
  </label>
</div>

<!-- Target Inspector Panel -->

</div>

  lat: 28.5383, lon: -81.3792, // Orlando, FL
  time: new Date(),
  zoom: 1.0,
  panX: 0, panY: 0,
  magLimit: 5.0,
  timeSpeed: 1,
  showConstellations: true,
  showMessier: true,
  showPlanets: true,
  showEcliptic: true,
  gridMode: 0, // 0: Off, 1: Alt/Az, 2: Equatorial
  hoveredObject: null
};

// Canvas & Container Observer Setup
const container = document.getElementById("canvas-container");
const canvas = document.getElementById("skymap");
const ctx = canvas.getContext("2d");
let width, height, centerR;

function setZoom(newZoom) {
  state.zoom = Math.max(0.5, Math.min(15.0, newZoom));
  document.getElementById("zoom-val").textContent = `${state.zoom.toFixed(1)}x`;
}

function resize() {
  width = canvas.width = container.clientWidth || window.innerWidth;
  height = canvas.height = container.clientHeight || window.innerHeight;
  centerR = Math.min(width, height) * 0.42;
}

window.addEventListener("resize", resize);
if (window.ResizeObserver) {
  new ResizeObserver(resize).observe(container);
}
resize();

// Astronomical Coordinates Engine
function getLST(date, lon) {
  const jd = (date.getTime() / 86400000) + 2440587.5;
  const d = jd - 2451545.0;
  let gmst = 280.46061837 + 360.98564736629 * d;
  gmst = (gmst % 360 + 360) % 360;
  return (gmst + lon + 360) % 360;
}

function radecToAltAz(ra, dec, lat, lst) {
  const ha = ((lst - ra) + 360) % 360;
  const rad = Math.PI / 180;
  
  const phi = lat * rad;
  const d = dec * rad;
  const h = ha * rad;
  
  const sinAlt = Math.sin(phi) * Math.sin(d) + Math.cos(phi) * Math.cos(d) * Math.cos(h);
  const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
  
  const cosAz = (Math.sin(d) - Math.sin(phi) * Math.sin(alt)) / (Math.cos(phi) * Math.cos(alt));
  let az = Math.acos(Math.max(-1, Math.min(1, cosAz)));
  if (Math.sin(h) > 0) az = 2 * Math.PI - az;
  
  return { alt: alt / rad, az: az / rad };
}

// Projection: Southward Looking (South = Bottom, Center = Zenith)
function altAzToScreen(alt, az) {
  if (alt < 0) return null; // Below horizon
  const r = centerR * state.zoom * Math.tan((90 - alt) * Math.PI / 360);
  const azRad = az * Math.PI / 180;
  const x = width / 2 + state.panX - r * Math.sin(azRad);
  const y = height / 2 + state.panY - r * Math.cos(azRad);
  return { x, y };
}

// Solar System Calculation
function getSolarSystem(date) {
  const jd = (date.getTime() / 86400000) + 2440587.5;
  const d = jd - 2451545.0;
  const rad = Math.PI / 180, deg = 180 / Math.PI;

  const eps = (23.4393 - 0.0000004 * d) * rad;

  // Sun
  const g = ((357.529 + 0.98560028 * d) % 360 + 360) % 360;
  const q = ((280.459 + 0.98564736 * d) % 360 + 360) % 360;
  const Lsun = (q + 1.915 * Math.sin(g * rad) + 0.020 * Math.sin(2 * g * rad)) % 360;
  const sunRa = (Math.atan2(Math.cos(eps) * Math.sin(Lsun * rad), Math.cos(Lsun * rad)) * deg + 360) % 360;
  const sunDec = Math.asin(Math.sin(eps) * Math.sin(Lsun * rad)) * deg;

  // Moon
  const Lmoon = (218.316 + 13.176396 * d) % 360;
  const Mmoon = (134.963 + 13.064993 * d) % 360;
  const Fmoon = (93.272 + 13.229350 * d) % 360;
  const lMoon = (Lmoon + 6.289 * Math.sin(Mmoon * rad)) % 360;
  const bMoon = 5.128 * Math.sin(Fmoon * rad);

  const lRad = lMoon * rad, bRad = bMoon * rad;
  const moonRa = (Math.atan2(Math.sin(lRad) * Math.cos(eps) - Math.tan(bRad) * Math.sin(eps), Math.cos(lRad)) * deg + 360) % 360;
  const moonDec = Math.asin(Math.sin(bRad) * Math.cos(eps) + Math.cos(bRad) * Math.sin(eps) * Math.sin(lRad)) * deg;

  const bodies = [
    { name: "Sun", ra: sunRa, dec: sunDec, mag: -26.7, color: "#fde047", radius: 7, type: "Star" },
    { name: "Moon", ra: moonRa, dec: moonDec, mag: -12.5, color: "#f1f5f9", radius: 6, type: "Natural Satellite" }
  ];

  const pData = [
    { name: "Mercury", a: 0.387, e: 0.2056, I: 7.00, L: 252.25, w: 77.46, N: 48.33, rate: 4.0923, mag: -0.4, color: "#cbd5e1", radius: 3 },
    { name: "Venus", a: 0.723, e: 0.0067, I: 3.39, L: 181.98, w: 131.77, N: 76.68, rate: 1.6021, mag: -4.2, color: "#fef08a", radius: 5 },
    { name: "Mars", a: 1.524, e: 0.0934, I: 1.85, L: 355.43, w: 336.06, N: 49.56, rate: 0.5240, mag: -1.5, color: "#f87171", radius: 4 },
    { name: "Jupiter", a: 5.204, e: 0.0485, I: 1.30, L: 34.35, w: 14.33, N: 100.46, rate: 0.0831, mag: -2.4, color: "#fde68a", radius: 6 },
    { name: "Saturn", a: 9.582, e: 0.0555, I: 2.49, L: 50.08, w: 93.06, N: 113.67, rate: 0.0335, mag: 0.2, color: "#fef08a", radius: 5 }
  ];

  pData.forEach(p => {
    const M = ((p.L + p.rate * d - p.w) % 360 + 360) % 360 * rad;
    const E = M + p.e * Math.sin(M);
    const x_orb = p.a * (Math.cos(E) - p.e);
    const y_orb = p.a * Math.sqrt(1 - p.e * p.e) * Math.sin(E);

    const v = Math.atan2(y_orb, x_orb);
    const r = Math.sqrt(x_orb * x_orb + y_orb * y_orb);
    const u = v + (p.w - p.N) * rad;
    const N_rad = p.N * rad, I_rad = p.I * rad;

    const x_hel = r * (Math.cos(N_rad) * Math.cos(u) - Math.sin(N_rad) * Math.sin(u) * Math.cos(I_rad));
    const y_hel = r * (Math.sin(N_rad) * Math.cos(u) + Math.cos(N_rad) * Math.sin(u) * Math.cos(I_rad));
    const z_hel = r * (Math.sin(u) * Math.sin(I_rad));

    const sunLonRad = Lsun * rad;
    const x_geo = x_hel + Math.cos(sunLonRad);
    const y_geo = y_hel + Math.sin(sunLonRad);
    const z_geo = z_hel;

    const ra_p = (Math.atan2(y_geo, x_geo) * deg + 360) % 360;
    const dec_p = Math.atan2(z_geo, Math.sqrt(x_geo * x_geo + y_geo * y_geo)) * deg;

    bodies.push({ name: p.name, ra: ra_p, dec: dec_p, mag: p.mag, color: p.color, radius: p.radius, type: "Planet" });
  });

  return bodies;
}

// Render Engine
let screenObjects = [];

function render() {
  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, width, height);

  const lst = getLST(state.time, state.lon);
  const cx = width / 2 + state.panX;
  const cy = height / 2 + state.panY;
  const R = centerR * state.zoom;
  screenObjects = [];

  // Horizon Boundary Circle
  ctx.strokeStyle = "#1e293b";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.stroke();

  // Grid Overlays
  if (state.gridMode === 1) { // Alt/Az Grid
    ctx.strokeStyle = "rgba(51, 65, 85, 0.4)";
    ctx.lineWidth = 1;
    [15, 30, 45, 60, 75].forEach(alt => {
      const r = centerR * state.zoom * Math.tan((90 - alt) * Math.PI / 360);
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
    });
    for (let az = 0; az < 360; az += 30) {
      const azRad = az * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx - R * Math.sin(azRad), cy - R * Math.cos(azRad));
      ctx.stroke();
    }
  } else if (state.gridMode === 2) { // Equatorial Grid
    ctx.strokeStyle = "rgba(14, 116, 144, 0.35)";
    ctx.lineWidth = 1;
    for (let dec = -60; dec <= 60; dec += 30) {
      ctx.beginPath();
      let first = true;
      for (let ra = 0; ra <= 360; ra += 10) {
        const hor = radecToAltAz(ra, dec, state.lat, lst);
        const pos = altAzToScreen(hor.alt, hor.az);
        if (pos) {
          if (first) { ctx.moveTo(pos.x, pos.y); first = false; }
          else ctx.lineTo(pos.x, pos.y);
        } else first = true;
      }
      ctx.stroke();
    }
  }

  // Draw Ecliptic Line
  if (state.showEcliptic) {
    ctx.strokeStyle = "rgba(234, 179, 8, 0.5)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    let first = true;
    const eps = 23.439 * Math.PI / 180;
    for (let l = 0; l <= 360; l += 4) {
      const lRad = l * Math.PI / 180;
      const ra = (Math.atan2(Math.cos(eps) * Math.sin(lRad), Math.cos(lRad)) * 180 / Math.PI + 360) % 360;
      const dec = Math.asin(Math.sin(eps) * Math.sin(lRad)) * 180 / Math.PI;
      const hor = radecToAltAz(ra, dec, state.lat, lst);
      const pos = altAzToScreen(hor.alt, hor.az);
      if (pos) {
        if (first) { ctx.moveTo(pos.x, pos.y); first = false; }
        else ctx.lineTo(pos.x, pos.y);
      } else first = true;
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Draw Constellation Figures, Node Stars & Name Labels
  if (state.showConstellations) {
    ctx.strokeStyle = "rgba(56, 189, 248, 0.45)";
    ctx.lineWidth = 1.3;
    CONSTELLATIONS.forEach(c => {
      const pts = [];
      c.lines.forEach(pair => {
        const s1 = STARS.find(s => s.name === pair[0]);
        const s2 = STARS.find(s => s.name === pair[1]);
        if (s1 && s2) {
          const h1 = radecToAltAz(s1.ra, s1.dec, state.lat, lst);
          const h2 = radecToAltAz(s2.ra, s2.dec, state.lat, lst);
          const p1 = altAzToScreen(h1.alt, h1.az);
          const p2 = altAzToScreen(h2.alt, h2.az);
          if (p1 && p2) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();

            pts.push(p1, p2);

            // Render node star points at vertices
            [p1, p2].forEach(p => {
              ctx.fillStyle = "#38bdf8";
              ctx.beginPath();
              ctx.arc(p.x, p.y, Math.max(2.0, 2.6 * Math.sqrt(state.zoom)), 0, Math.PI * 2);
              ctx.fill();
            });
          }
        }
      });

      // Render Constellation Name Label at Figure Centroid
      if (pts.length > 0) {
        const avgX = pts.reduce((sum, p) => sum + p.x, 0) / pts.length;
        const avgY = pts.reduce((sum, p) => sum + p.y, 0) / pts.length;
        
        ctx.fillStyle = "rgba(125, 211, 252, 0.88)";
        const fontSize = Math.min(18, Math.max(10, Math.round(11 * Math.pow(state.zoom, 0.35))));
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
        ctx.shadowBlur = 5;
        ctx.fillText(c.name.toUpperCase(), avgX, avgY);
        ctx.shadowBlur = 0;
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
      }
    });
  }

  // Draw All Real Stars
  STARS.forEach(s => {
    if (s.mag > state.magLimit) return;
    const hor = radecToAltAz(s.ra, s.dec, state.lat, lst);
    const pos = altAzToScreen(hor.alt, hor.az);
    if (!pos) return;

    let baseR;
    if (s.mag < 0) baseR = 5.5;
    else if (s.mag < 1.0) baseR = 4.5;
    else if (s.mag < 2.0) baseR = 3.6;
    else if (s.mag < 3.0) baseR = 2.8;
    else if (s.mag < 4.0) baseR = 2.2;
    else baseR = 1.6;

    const r = baseR * Math.sqrt(state.zoom);
    ctx.fillStyle = s.bv > 1.2 ? "#fca5a5" : s.bv > 0.5 ? "#fef08a" : s.bv < 0.1 ? "#93c5fd" : "#ffffff";
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
    ctx.fill();

    screenObjects.push({ ...s, x: pos.x, y: pos.y, alt: hor.alt, az: hor.az, category: "Star" });

    if (s.mag < 2.2) {
      ctx.fillStyle = "rgba(226, 232, 240, 0.75)";
      ctx.font = `${Math.min(14, Math.max(10, 10 * Math.pow(state.zoom, 0.25)))}px sans-serif`;
      ctx.fillText(s.name, pos.x + r + 3, pos.y + 3);
    }
  });

  // Draw ALL Messier Objects (M1 to M110)
  if (state.showMessier) {
    MESSIER.forEach(m => {
      const hor = radecToAltAz(m.ra, m.dec, state.lat, lst);
      const pos = altAzToScreen(hor.alt, hor.az);
      if (!pos) return;

      const scale = Math.min(2.5, Math.sqrt(state.zoom));
      ctx.strokeStyle = "#f43f5e";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(pos.x, pos.y, 5 * scale, 3.5 * scale, Math.PI / 4, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = "#fda4af";
      ctx.font = "10px monospace";
      ctx.fillText(m.id, pos.x + 7, pos.y + 3);

      screenObjects.push({ name: `${m.id} (${m.name})`, ra: m.ra, dec: m.dec, mag: m.mag, type: m.type, x: pos.x, y: pos.y, alt: hor.alt, az: hor.az, category: "Messier Object" });
    });
  }

  // Draw Planets & Moon & Sun
  if (state.showPlanets) {
    const planets = getSolarSystem(state.time);
    planets.forEach(p => {
      const hor = radecToAltAz(p.ra, p.dec, state.lat, lst);
      const pos = altAzToScreen(hor.alt, hor.az);
      if (!pos) return;

      const rad = p.radius * Math.min(Math.sqrt(state.zoom), 2.2);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, rad, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 10px sans-serif";
      ctx.fillText(p.name, pos.x + rad + 4, pos.y + 3);

      screenObjects.push({ name: p.name, ra: p.ra, dec: p.dec, mag: p.mag, type: p.type, x: pos.x, y: pos.y, alt: hor.alt, az: hor.az, category: "Solar System" });
    });
  }

  // Draw Southward Cardinal Compass Points
  const compass = [
    { label: "S", az: 180 }, { label: "SW", az: 225 },
    { label: "W", az: 270 }, { label: "NW", az: 315 },
    { label: "N", az: 0 },   { label: "NE", az: 45 },
    { label: "E", az: 90 },  { label: "SE", az: 135 }
  ];
  ctx.font = "bold 12px monospace";
  compass.forEach(c => {
    const azRad = c.az * Math.PI / 180;
    const x = cx - (R + 14) * Math.sin(azRad);
    const y = cy - (R + 14) * Math.cos(azRad);
    ctx.fillStyle = c.label === "S" ? "#f43f5e" : "#38bdf8";
    ctx.fillText(c.label, x - 6, y + 4);
  });

  // Draw Visual Hover Targeting Reticle over Selected Object
  if (state.hoveredObject) {
    const activeTarget = screenObjects.find(o => o.name === state.hoveredObject.name);
    if (activeTarget) {
      ctx.save();
      ctx.strokeStyle = "#f43f5e";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(activeTarget.x, activeTarget.y, 14, 0, Math.PI * 2);
      ctx.stroke();

      // Crosshairs
      ctx.beginPath();
      ctx.moveTo(activeTarget.x - 18, activeTarget.y); ctx.lineTo(activeTarget.x - 9, activeTarget.y);
      ctx.moveTo(activeTarget.x + 9, activeTarget.y); ctx.lineTo(activeTarget.x + 18, activeTarget.y);
      ctx.moveTo(activeTarget.x, activeTarget.y - 18); ctx.lineTo(activeTarget.x, activeTarget.y - 9);
      ctx.moveTo(activeTarget.x, activeTarget.y + 9); ctx.lineTo(activeTarget.x, activeTarget.y + 18);
      ctx.stroke();
      ctx.restore();
    }
  }

  // Time Advancement
  if (state.timeSpeed > 1) {
    state.time = new Date(state.time.getTime() + state.timeSpeed * 16);
    updateDateInput();
  }

  requestAnimationFrame(render);
}

// Date/Time Controls
const datetimeInput = document.getElementById("datetime-input");
function updateDateInput() {
  const t = state.time;
  const iso = new Date(t.getTime() - (t.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
  datetimeInput.value = iso;
}
updateDateInput();

datetimeInput.addEventListener("change", e => {
  if (e.target.value) state.time = new Date(e.target.value);
});
document.getElementById("btn-now").addEventListener("click", () => { state.time = new Date(); updateDateInput(); });
document.getElementById("btn-sub-hour").addEventListener("click", () => { state.time = new Date(state.time.getTime() - 3600000); updateDateInput(); });
document.getElementById("btn-add-hour").addEventListener("click", () => { state.time = new Date(state.time.getTime() + 3600000); updateDateInput(); });
document.getElementById("btn-sub-day").addEventListener("click", () => { state.time = new Date(state.time.getTime() - 86400000); updateDateInput(); });
document.getElementById("btn-add-day").addEventListener("click", () => { state.time = new Date(state.time.getTime() + 86400000); updateDateInput(); });

// Multi-Touch Pinch Zoom & Mouse Drag Gesture Engine
const activePointers = new Map();
let prevDiff = -1;
let dragging = false, lastX = 0, lastY = 0;

function checkObjectHover(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (clientX - rect.left) * scaleX;
  const my = (clientY - rect.top) * scaleY;

  // 22px detection radius for accurate hovering on touchscreen & PC
  const target = screenObjects.find(o => Math.hypot(o.x - mx, o.y - my) < 22);
  const inspector = document.getElementById("inspector");

  if (target) {
    state.hoveredObject = target;
    document.getElementById("obj-name").textContent = target.name;
    document.getElementById("obj-type").textContent = target.type || target.category;
    document.getElementById("obj-mag").textContent = typeof target.mag === 'number' ? target.mag.toFixed(2) : target.mag;
    
    // Convert Right Ascension to Hours and Minutes
    const raHours = Math.floor(target.ra / 15);
    const raMins = Math.floor(((target.ra / 15) - raHours) * 60);
    const raStr = `${String(raHours).padStart(2, '0')}h ${String(raMins).padStart(2, '0')}m`;
    const decSign = target.dec >= 0 ? '+' : '';
    const decStr = `${decSign}${target.dec.toFixed(1)}°`;

    document.getElementById("obj-radec").textContent = `${raStr} / ${decStr}`;
    document.getElementById("obj-altaz").textContent = `${target.alt.toFixed(1)}° / ${target.az.toFixed(1)}°`;
    inspector.style.display = "block";
  } else {
    state.hoveredObject = null;
    inspector.style.display = "none";
  }
}

canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activePointers.size === 1) {
    lastX = e.clientX;
    lastY = e.clientY;
    dragging = true;
    checkObjectHover(e.clientX, e.clientY);
  }
});

canvas.addEventListener("pointermove", e => {
  if (!activePointers.has(e.pointerId) && activePointers.size > 0) return;
  
  if (activePointers.has(e.pointerId)) {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }

  if (activePointers.size === 2) {
    // Multi-touch pinch zoom
    dragging = false;
    const pts = Array.from(activePointers.values());
    const curDiff = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);

    if (prevDiff > 0) {
      const zoomFactor = curDiff / prevDiff;
      setZoom(state.zoom * zoomFactor);
    }
    prevDiff = curDiff;
  } else if (dragging) {
    // Single finger or cursor drag
    state.panX += e.clientX - lastX;
    state.panY += e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
  }

  // Hover detection
  checkObjectHover(e.clientX, e.clientY);
});

function handlePointerEnd(e) {
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) prevDiff = -1;
  if (activePointers.size === 0) {
    dragging = false;
  } else if (activePointers.size === 1) {
    const remaining = Array.from(activePointers.values())[0];
    lastX = remaining.x;
    lastY = remaining.y;
    dragging = true;
  }
}

canvas.addEventListener("pointerup", handlePointerEnd);
canvas.addEventListener("pointercancel", handlePointerEnd);

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  setZoom(state.zoom * (e.deltaY < 0 ? 1.15 : 0.85));
}, { passive: false });

// UI Control Listeners
document.getElementById("btn-zoom-in").addEventListener("click", () => setZoom(state.zoom * 1.3));
document.getElementById("btn-zoom-out").addEventListener("click", () => setZoom(state.zoom / 1.3));

document.getElementById("mag-limit").addEventListener("input", e => {
  state.magLimit = parseFloat(e.target.value);
  document.getElementById("mag-val").textContent = state.magLimit.toFixed(1);
});
document.getElementById("time-speed").addEventListener("change", e => state.timeSpeed = parseInt(e.target.value));

document.getElementById("toggle-constellations").addEventListener("click", function() {
  state.showConstellations = !state.showConstellations;
  this.classList.toggle("active", state.showConstellations);
});
document.getElementById("toggle-messier").addEventListener("click", function() {
  state.showMessier = !state.showMessier;
  this.classList.toggle("active", state.showMessier);
});
document.getElementById("toggle-planets").addEventListener("click", function() {
  state.showPlanets = !state.showPlanets;
  this.classList.toggle("active", state.showPlanets);
});
document.getElementById("toggle-ecliptic").addEventListener("click", function() {
  state.showEcliptic = !state.showEcliptic;
  this.classList.toggle("active", state.showEcliptic);
});

const gridBtn = document.getElementById("toggle-grid");
gridBtn.addEventListener("click", function() {
  state.gridMode = (state.gridMode + 1) % 3;
  const modes = ["Grid: Off", "Grid: Alt/Az", "Grid: Equatorial"];
  this.textContent = modes[state.gridMode];
  this.classList.toggle("active", state.gridMode !== 0);
});

document.getElementById("toggle-night").addEventListener("click", function() {
  document.body.classList.toggle("night-mode");
  this.classList.toggle("active");
});

requestAnimationFrame(render);
</script>
</body>
